[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools", "wheel"]

[project]
authors = [
  {name = "Joséphine Wolf Oberholtzer", email = "josephine.wolf.oberholtzer@gmail.com"}
]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Operating System :: MacOS",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "Sphinx >= 8",
  "Unidecode >= 1.3.6",
  "black",
]
description = "Tools for building documentation with Sphinx, Graphviz and LaTeX"
keywords = [
  "sphinx",
  "graphviz",
  "datastructures",
  "documentation",
]
license = {text = "MIT"}
name = "uqbar"
readme = "README.md"
requires-python = ">=3.11"
version = "0.9.6"

[project.urls]
homepage = "https://github.com/supriya-project/uqbar"
documentation = "https://supriya-project.github.io/uqbar"
repository = "https://github.com/supriya-project/uqbar"

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = [
  "-vv",
  "-rf",
  "--cov-branch",
  "--cov-report=html",
  "--cov-report=term",
  "--doctest-modules",
]
doctest_optionflags = [
  "ELLIPSIS",
  "NORMALIZE_WHITESPACE",
]
markers = [
  "sphinx: mark a test as a Sphinx test."
]
testpaths = [
  "tests",
  "src",
]

[tool.ruff]
extend-include = ["*.ipynb"]
line-length = 88
target-version = "py311"

[tool.ruff.lint.pep8-naming]
ignore-names = ["test_*"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
supriya = ["py.typed"]

[dependency-groups]
dev = [
  "mypy",
  "prek",
  "pytest",
  "pytest-cov",
  "pytest-asyncio",
  "ruff",
  "sphinx-immaterial >= 0.11",
  "types-PyYAML",
  "types-docutils",
]
